[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-check"
version = "0.1.0"
description = "Checks that every portfolio link, demo, README and CV works for a logged-out visitor"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nikita Vassiljev", email = "vassiljev.nikita@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
  "playwright>=1.45",
  "python-docx>=1.1",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
portfolio-check = "portfolio_check.cli:main"

[tool.setuptools]
packages = ["portfolio_check", "portfolio_check.checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
