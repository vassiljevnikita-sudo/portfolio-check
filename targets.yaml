# What portfolio-check verifies. A new project is one new entry.
# Target names are used with --target NAME and --local NAME=PATH.

settings:
  link_timeout: 10                # seconds per URL
  readme_first_screen_lines: 60   # "first screen" of a README
  cv_rules: cv_rules.yaml
  languagetool_allowlist: allowlist.txt
  # Hosts that refuse requests from GitHub's runners. Only on a CI runner, a listed
  # status from a listed host is reported as "not verified from CI" instead of failing.
  # A local run still needs status 200 for the same URL.
  link_exceptions:
    - host: scholar.google.com
      status: [403]
      reason: Google Scholar answers 403 to GitHub Actions runners; the same URL returns 200 from a home connection

repos:
  - name: complaint-dossier
    slug: vassiljevnikita-sudo/complaint-dossier
  - name: simple-and-light-research
    slug: vassiljevnikita-sudo/simple-and-light-research
  - name: questify-releases
    slug: vassiljevnikita-sudo/questify-releases
    # release-only repo (APK downloads); checked by links and README, not CI
    skip_checks: [ci]
    skip_reason: release-only repo without a build, so there is no CI run to check
  - name: profile
    slug: vassiljevnikita-sudo/vassiljevnikita-sudo
    # the profile README is a landing page for three projects, not a project README
    skip_checks: [readme, ci]
    skip_reason: GitHub profile README, a landing page rather than a project; checked by links only
  - name: portfolio-check
    slug: vassiljevnikita-sudo/portfolio-check
    # portfolio.yml is the report itself; the repo's own CI is the unit-test workflow.
    ci_workflows: [test.yml]
  - name: safeincloud-linux
    slug: vassiljevnikita-sudo/safeincloud-linux
    # side project outside the job portfolio, listed so that every public repo of mine
    # (forks excluded) gets the secret and denylist scans
    # links skipped: its 14 README links are github.com pages, and that many extra
    # requests got a 429 from GitHub on the Actions runner (run 40996556362)
    skip_checks: [readme, links]
    skip_reason: side project with a German README, not one of the portfolio projects; checked for secrets, denylist and CI

sites:
  # The landing page as restored on 30 Oct 2026 (the version with the 3D phone),
  # with the later text fixes of the same day: iOS opens the web app, the footer
  # GitHub link goes to the public questify-releases repo.
  # The render check cannot test the WebGL canvas, so the 3D phone is not checked here.
  - name: questify
    url: https://mastertasker.expo.app/willkommen/
    required_phrases:
      - bringen jetzt XP
      - Kostenlos auf Android und im Web
      - Auf dem iPhone öffnest du Questify im Browser
      - Vier Looks
      - Noch Fragen
      - Impressum
      - Datenschutz
    required_links:
      - https://github.com/vassiljevnikita-sudo/questify-releases/releases/latest/download/questify.apk
      - https://github.com/vassiljevnikita-sudo/questify-releases
      - https://mastertasker.expo.app/
      - https://mastertasker.expo.app/website/5/impressum.html
      - https://mastertasker.expo.app/website/5/datenschutz.html
    forbidden_phrases:
      # invite banner text; must only show with an invite code in the URL
      - lädt dich zu Questify ein
    min_numbers: 0
    # Screenshots that showed HTTP 429 on 30 Oct 2026: the hero phone, the
    # leaderboard phone and the three other Looks tiles. Matched by file name, so
    # both the shots/ and the phone-model/screens/ paths count.
    required_images:
      - /arena/start.webp
      - /arena/rangliste.webp
      - /bonbon/start.webp
      - /sternenstaub/start.webp
      - /classic/start.webp

  # The QBD page has three views since 30 Oct 2026 (simple-and-light PR #65), each
  # its own URL. The root URL is now only the Start view (intro, result, author,
  # disclaimer); charts, trades and the research sections moved to the other two,
  # so each view is checked as its own site.
  - name: qbd-demo
    url: https://simple-light-qbd.expo.app/
    required_phrases:
      - Nikita Vassiljev
      - Research only, no real capital, no investment advice
      - "Result: not so far"
      # the header navigation to the other two views
      - Graphen & Trades
      - Entwicklung
    required_links:
      - https://github.com/vassiljevnikita-sudo/simple-and-light-research
      - https://simple-light-qbd.expo.app/graphen
      - https://simple-light-qbd.expo.app/entwicklung
    forbidden_phrases: &qbd_forbidden
      - Keine Messwerte
      - Keine ausgeführten Trades
      - Messwerte nicht verfügbar
      - Historie nicht verfügbar
      - Trades nicht verfügbar
      - Lädt
    forbidden_patterns: &qbd_dash
      # a line that holds nothing but a dash placeholder (em dash, en dash or hyphen)
      - "^\\s*[—–-]\\s*$"
    # the Start view is text only: the model count in German and English (2.790 / 2,790)
    min_numbers: 2

  - name: qbd-demo-graphen
    url: https://simple-light-qbd.expo.app/graphen
    required_phrases:
      - Research only, no real capital, no investment advice
      # the restored chart cards and their labels
      - Live-Demo
      - Leader5
      - Trading 212
      - Trades
      # one-line honesty labels: demo account, backtests, default Sample tab
      - virtual money
      - simulated backtests
      - in-sample backtest
    # Charts and trades load after the page; after network idle none of their
    # empty, error or loading texts may remain.
    forbidden_phrases: *qbd_forbidden
    forbidden_patterns: *qbd_dash
    # 92 on 30 Oct 2026 after network idle (live and Leader5 metrics, axes, 20 trade
    # rows); about 20 without the trade rows, so a missing trade table fails
    min_numbers: 60

  - name: qbd-demo-entwicklung
    url: https://simple-light-qbd.expo.app/entwicklung
    required_phrases:
      - Nikita Vassiljev
      - Research only, no real capital, no investment advice
      - Umfang
      - Frühere Sieger hielten nicht
      - Monatliches Neutrainieren schadet
      - Was gescheitert ist
      - Quellen
    required_links:
      - https://github.com/vassiljevnikita-sudo/simple-and-light-research
    forbidden_phrases: *qbd_forbidden
    forbidden_patterns: *qbd_dash
    # 131 on 30 Oct 2026 (research figures, built into the page)
    min_numbers: 100

# CV files hold personal contact data and are never committed (cv/ is gitignored).
# Pass them with --cv-de / --cv-en or the env vars below. Without a file the CV
# checks are skipped; with --require-cv they fail instead.
cvs:
  - name: cv-de
    path: cv/Lebenslauf_Nikita_Vassiljev_2026-11.docx
    env: PORTFOLIO_CV_DE
    language: de-DE
    rules_language: de
  - name: cv-en
    path: cv/CV_Nikita_Vassiljev_2026-11.docx
    env: PORTFOLIO_CV_EN
    language: en-US
    rules_language: en
